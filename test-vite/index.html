<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parquet Lite Vite Test</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      margin: 10px 5px;
      cursor: pointer;
    }
    pre {
      background: #f5f5f5;
      padding: 15px;
      border-radius: 5px;
      overflow-x: auto;
    }
    .status {
      margin: 10px 0;
      padding: 10px;
      border-radius: 5px;
    }
    .success { background: #d4edda; color: #155724; }
    .error { background: #f8d7da; color: #721c24; }
  </style>
</head>
<body>
  <h1>Parquet Lite Vite Bundling Test</h1>
  
  <div>
    <button id="test-writer">Test Writer</button>
    <button id="test-reader">Test Reader</button>
    <button id="test-full">Test Full Roundtrip</button>
  </div>
  
  <div id="status"></div>
  <pre id="output"></pre>

  <script type="module" src="/main.js"></script>
</body>
</html>
